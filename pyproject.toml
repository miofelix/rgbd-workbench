[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rgbd-workbench"
version = "0.1.0"
description = "Local RGB-D analysis and visualization workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "imageio-ffmpeg>=0.5,<1",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rfc8785>=0.1,<1",
  "scipy>=1.14,<2",
  "tifffile>=2024.9,<2027",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
formats-exr = ["OpenEXR>=3.3,<4"]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
rgbd-workbench = "rgbd_workbench.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rgbd_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rgbd_workbench"]
